name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si se sube otro commit a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint (Detekt + ktlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Detekt y ktlint
        run: ./gradlew detekt ktlintCheck --no-daemon
      - name: Subir reportes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/ktlint/

  test:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de todos los módulos
        run: ./gradlew testDebugUnitTest :core:test --no-daemon
      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  build:
    name: Build del sandbox
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK debug
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
